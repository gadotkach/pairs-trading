name: Pair Trading Analysis

on:
  schedule:
    # Каждый час 24/7 (UTC)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch fresh prices from MOEX
        run: |
          python fetch_prices.py

      - name: Run z_analytics (создаёт analytics_z.xlsx)
        run: |
          python z_analytics.py

      - name: Run pairs_analysis
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_PROXY: ${{ secrets.TG_PROXY }}
        run: |
          python pairs_analysis.py

      - name: Commit state.json, Excel, cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json pair_strategies_analysis.xlsx analytics_z.xlsx cache/ fetch_prices.py || true
          git diff --cached --quiet && echo "Нет изменений — коммит не нужен" || \
            (git commit -m "Auto update [skip ci]" && git push)
